[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jkbiolib"
version = "1.1.0"
description = "Bioinformatics library"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "cyvcf2>=0.30",
    "pandas>=3.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "twine",
    "ipython>=9.14.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle, pyflakes, isort

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatchling.build.targets.wheel]
packages = ["jkbiolib"]

[tool.hatchling.build.targets.wheel.force-include]
"jkbiolib/data" = "jkbiolib/data"

